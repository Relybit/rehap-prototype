    { l:"STEP3", t:<>登録案内・<br />初期設定</>, i:<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg> },
    { l:"STEP4", t:"QRコード発行", i:<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M19 14v7M14 19h3"/></svg> },
    { l:"STEP5", t:<>QR設置・<br />運用開始</>, i:<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><rect x="9" y="12" width="6" height="9"/></svg> },
  ];
  return (
    <section style={flS.wrap}>
      <div style={flS.inner}>
        <div style={flS.card}>
          <h3 style={flS.title}>はじめるまでの流れ</h3>
          <div style={flS.steps} data-grid="steps">
            {steps.map((s, i) => (
              <div key={i} style={flS.stepWrap}>
                <div style={flS.step}>
                  <div style={flS.stepLabel}>{s.l}</div>
                  <div style={flS.stepCircle}>{s.i}</div>
                  <div style={flS.stepText}>{s.t}</div>
                </div>
                {i < steps.length - 1 && <div style={flS.arrow}>›</div>}
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

/* ── FAQ ── */
const FAQ_ITEMS = [
  { q:"専門的な知識は必要ですか？", a:"不要です。QRコードを設置するだけで自動で動きます。" },
  { q:"掲載される商品はどんなものですか？", a:"健康・美容・ライフスタイル関連の商品が中心です。店舗の雰囲気に合わないものは掲載しません。" },
  { q:"解約はできますか？", a:"いつでも解約可能です。違約金等はありません。" },
  { q:"LINEは必須ですか？", a:"ユーザーのLINEログインで来店を個人特定します。店舗側はLINEアカウント不要です。" },
  { q:"どんな業種でも導入できますか？", a:"来店型のビジネスであれば業種を問わず導入いただけます。" },
];
function FAQ() {
  const [open, setOpen] = useState(null);
  return (
    <section style={{ padding:"16px 40px 40px", background:"#fff" }}>
      <div style={{ maxWidth:820, margin:"0 auto" }}>
        <div style={{ background:"#F5F8FC", border:"1px solid #DCE3EE", borderRadius:10, padding:"26px 28px 24px" }}>
          <h2 style={{ fontSize:20, fontWeight:900, color:"#0F2A4F", margin:"0 0 16px", textAlign:"center" }}>よくあるご質問</h2>
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {FAQ_ITEMS.map((f, i) => {
              const isOpen = open === i;
              return (
                <div key={i} style={{ background:"#fff", borderRadius:6, border:"1px solid #DCE3EE", overflow:"hidden" }}>
                  <button
                    style={{ display:"flex", alignItems:"center", gap:10, padding:"12px 16px", fontSize:13, fontWeight:600, color:"#2A3F5F", cursor:"pointer", width:"100%", textAlign:"left", background:"#fff", border:0 }}
                    onClick={() => setOpen(isOpen ? null : i)}
                  >
                    <span style={{ color:"#1FA89D", fontWeight:800, fontSize:14 }}>Q.</span>
                    <span style={{ flex:1 }}>{f.q}</span>
                    <span style={{ color:"#1FA89D", fontSize:13, transform:isOpen?"rotate(180deg)":"none", transition:"transform 0.2s" }}>⌄</span>
                  </button>
                  {isOpen && <div style={{ padding:"0 16px 14px 38px", fontSize:12, color:"#5A6B85", lineHeight:1.85 }}>{f.a}</div>}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </section>
  );
}

/* ── ContactForm ── */
function ContactForm() {
  const [data, setData] = useState({ company:"", industry:"", name:"", phone:"", email:"", message:"" });
  const [sent, setSent] = useState(false);
  const set = (k) => (e) => setData({ ...data, [k]: e.target.value });
  const iS = { width:"100%", border:0, borderRadius:4, padding:"9px 11px", fontSize:13, background:"#fff", outline:"none", color:"#0F2A4F" };
  const sS = { ...iS, appearance:"none", backgroundImage:"url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%231FA89D' stroke-width='2' fill='none'/></svg>\")", backgroundRepeat:"no-repeat", backgroundPosition:"right 10px center", paddingRight:28 };
  return (
    <section id="contact" style={{ padding:"16px 40px 40px", background:"#fff", scrollMarginTop:20 }}>
      <div style={{ maxWidth:820, margin:"0 auto" }}>
        <div style={{ background:"#1FA89D", borderRadius:10, padding:"26px 32px 28px", color:"#fff" }}>
          <h2 style={{ fontSize:22, fontWeight:900, color:"#fff", margin:"0 0 4px", textAlign:"center" }}>まずは無料で相談する</h2>
          <p style={{ fontSize:12, color:"#E8F6F4", textAlign:"center", margin:"0 0 18px" }}>お気軽にお問い合わせください。1〜2営業日以内にご連絡します。</p>
          {sent ? (
            <div style={{ textAlign:"center", padding:"30px 16px", color:"#fff" }}>
              <div style={{ fontSize:36, marginBottom:8 }}>✓</div>
              <div style={{ fontWeight:800, fontSize:17 }}>送信ありがとうございました</div>
              <div style={{ color:"#E8F6F4", fontSize:12, marginTop:6 }}>担当者より1〜2営業日以内にご連絡いたします。</div>
            </div>
          ) : (
            <>
              <div style={{ display:"grid", gridTemplateColumns:"140px 1fr", gap:"12px 14px", alignItems:"center" }} data-grid="form">
                <div style={{ display:"flex", alignItems:"center", gap:6, fontSize:13, fontWeight:700, color:"#fff" }}>店舗名 <span style={{ background:"#D63327", color:"#fff", fontSize:9, fontWeight:700, padding:"1px 5px", borderRadius:3 }}>必須</span></div>
                <input style={iS} placeholder="例) リハップ整体院" value={data.company} onChange={set("company")} />
                <div style={{ display:"flex", alignItems:"center", gap:6, fontSize:13, fontWeight:700, color:"#fff" }}>業種 <span style={{ background:"#D63327", color:"#fff", fontSize:9, fontWeight:700, padding:"1px 5px", borderRadius:3 }}>必須</span></div>
                <select style={sS} value={data.industry} onChange={set("industry")}>
                  <option value="">選択してください</option>
                  <option>整体院</option><option>サロン</option><option>ジム</option><option>飲食店</option><option>その他</option>
                </select>
                <div style={{ display:"flex", alignItems:"center", gap:6, fontSize:13, fontWeight:700, color:"#fff" }}>お名前 <span style={{ background:"#D63327", color:"#fff", fontSize:9, fontWeight:700, padding:"1px 5px", borderRadius:3 }}>必須</span></div>
                <input style={iS} placeholder="例) 山田 太郎" value={data.name} onChange={set("name")} />
                <div style={{ display:"flex", alignItems:"center", gap:6, fontSize:13, fontWeight:700, color:"#fff" }}>メールアドレス <span style={{ background:"#D63327", color:"#fff", fontSize:9, fontWeight:700, padding:"1px 5px", borderRadius:3 }}>必須</span></div>
                <input style={iS} type="email" placeholder="例) yamada@example.com" value={data.email} onChange={set("email")} />
                <div style={{ fontSize:13, fontWeight:700, color:"#fff" }}>電話番号</div>
                <input style={iS} type="tel" placeholder="例) 090-1234-5678" value={data.phone} onChange={set("phone")} />
                <div style={{ fontSize:13, fontWeight:700, color:"#fff" }}>ご質問・ご要望</div>
                <textarea style={{ ...iS, resize:"vertical", minHeight:70, fontFamily:"inherit" }} placeholder="ご自由にご記入ください" value={data.message} onChange={set("message")} />
              </div>
              <div style={{ textAlign:"center", marginTop:18 }}>
                <button style={{ background:"#0F2A4F", color:"#fff", padding:"13px 56px", borderRadius:999, fontWeight:700, fontSize:15, boxShadow:"0 6px 14px rgba(15,42,79,0.35)", display:"inline-flex", alignItems:"center", gap:10, border:0, cursor:"pointer" }} onClick={() => setSent(true)}>
                  <span>無料で相談する</span>
                  <span style={{ display:"inline-flex", alignItems:"center", justifyContent:"center", width:22, height:22, borderRadius:999, background:"rgba(255,255,255,0.22)", fontSize:12 }}>›</span>
                </button>
              </div>
            </>
          )}
        </div>
      </div>
    </section>
  );
}

function App() {
  return (
